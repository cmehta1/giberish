<body data-page="worlds" data-no-dust>
<main class="sw" id="sw">
  <div class="sw-track" id="sw-track">
    <!-- The world: a pinned stage of parallax layers (built by worlds.js) -->
    <section class="sw-stage" id="sw-stage" aria-label="Scent world">
      <div class="sw-layers" id="sw-layers" aria-hidden="true"></div>
      <div class="sw-shade sw-shade-b" id="sw-shade-b" aria-hidden="true"></div>
      <div class="sw-shade sw-shade-l" id="sw-shade-l" aria-hidden="true"></div>
      <div class="sw-shade sw-shade-r" id="sw-shade-r" aria-hidden="true"></div>

      <div class="sw-hud" id="sw-hud">
        <div class="sw-hud-title">
          <span class="eyebrow">Scent World <b id="sw-count"></b></span>
          <span class="sw-world-name" id="sw-world-name"></span>
        </div>
        <div class="sw-hud-tools" id="sw-tools"></div>
      </div>

      <nav class="sw-rail" id="sw-rail" aria-label="Choose a fragrance world">
        <button class="sw-rail-arrow" data-step="-1" aria-label="Previous world"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="sw-rail-list" id="sw-rail-list"></div>
        <button class="sw-rail-arrow" data-step="1" aria-label="Next world"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      </nav>

    </section>

    <!-- Story panels scroll over the pinned world -->
    <div class="sw-panels" id="sw-panels"></div>
  </div>
  <!-- fade-through-dark veil used when travelling between worlds -->
  <div class="sw-veil show" id="sw-veil" aria-hidden="true"><i></i><picture><source type="image/webp" srcset="assets/img/buddha-sil.webp"><img src="assets/img/buddha-sil.png" alt="" decoding="async"></picture></div>
